name: Appalling Farrago
title: Appalling Farrago
description: A blog about ruby, ember and anything else I want to write about.
url: https://appallingfarrago.com/
highlighter: rouge
plugins:
  - jekyll-redirect-from
# Setting exclude replaces Jekyll 3's defaults, so they're repeated here.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
