<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% if page.layout == "post" %}{{ page.title }} · {{ site.name }} archive{% else %}{{ site.name }} · Archive, 2013–2019{% endif %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poly:ital@0;1&family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@400;500&display=swap">
    <link rel="stylesheet" href="/css/app.css">
    <link href="/feed.xml" rel="alternate" title="RSS" type="application/rss+xml">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <div class="site-brand">
          <a class="site-title" href="/">Appalling Farrago</a>
          <span class="archive-badge">Archive · 2013–2019</span>
        </div>
        <p class="tagline">A blog about stuff</p>
      </div>
    </header>

    <main>
      <div class="container">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          Matthew Sumner<br>
          Engineering Leader<br>
          <a href="mailto:matt.m.sumner@gmail.com">matt.m.sumner@gmail.com</a>
        </p>
        <p class="site-footer-links">
          <a href="https://www.linkedin.com/in/matt-m-sumner/">linkedin.com/in/matt-m-sumner</a><br>
          <a href="https://github.com/MattMSumner">github.com/MattMSumner</a>
        </p>
      </div>
    </footer>
  </body>
</html>
